[project]
name = "psagent"
version = "0.1.0"
description = "PSAgent 2.0 – Materialverleih und PSA-Prüfungen im Verein"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django[argon2]>=6.1,<6.2",
    "psycopg[binary]>=3.2",
    "gunicorn>=23",
    "webauthn>=2.5",
    "django-axes>=8.0",
    "typst>=0.13",
    "segno>=1.6",
    "msal>=1.31",
    "pyhanko>=0.25",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "ruff>=0.17",
    "mypy>=2.3",
    "django-stubs[compatible-mypy]>=6.1,<6.2",
    "pre-commit>=4",
    "pytest-playwright>=0.7",
    "pypdf>=5",
    "psagent-signieren",
]

[tool.uv]
# Django-Projekt, kein installierbares Paket.
package = false

[tool.uv.workspace]
# Das Signier-Tool ist Mitglied, damit `uv export --package psagent-signieren` seine festen
# Versionen aus uv.lock ausgeben kann (#105).
members = ["signiertool"]

[tool.uv.sources]
# Signier-Tool für den PC (#38): eigenes Paket ohne Django, in den Tests mit geprüft.
psagent-signieren = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle Warnungen
    "F",   # pyflakes
    "I",   # Import-Sortierung
    "B",   # bugbear
    "UP",  # pyupgrade
    "S",   # bandit (Sicherheit)
    "DJ",  # Django
    "N",   # Namenskonventionen
    "SIM", # Vereinfachungen
    "RUF", # ruff-eigene Regeln
]

# Deutscher Gedankenstrich ist in Texten gewollt.
allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]                     # assert und Test-Passwörter sind in Tests gewollt
"psagent/settings/*.py" = ["F403", "F405"]              # Einstellungen erben per Stern-Import
"psagent/settings/dev.py" = ["S105"]                    # fester Schlüssel nur für die Entwicklung
"psagent/settings/test.py" = ["S105"]                   # fester Schlüssel nur für Tests

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
# django-axes liefert keine Typinformationen.
module = ["axes.*", "msal.*", "asn1crypto.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "psagent.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "psagent.settings.test"
testpaths = ["tests"]
python_files = ["test_*.py"]
# Browser-Tests (Marker e2e) laufen in einem eigenen CI-Job: uv run pytest -m e2e
addopts = "-ra --strict-markers -m 'not e2e'"
markers = ["e2e: Ende-zu-Ende-Tests im Browser mit Playwright"]
