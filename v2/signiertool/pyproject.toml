[project]
name = "psagent-signieren"
version = "0.1.0"
description = "PSAgent: Prüfprotokolle am PC mit dem YubiKey signieren (#38)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pyhanko[pkcs11,image-support]>=0.25",
    "pypdf>=5",
]

[project.scripts]
signieren = "psagent_signieren.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["psagent_signieren"]
