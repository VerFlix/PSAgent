{% extends "base.html" %}
{% block title %}Passkey einrichten{% endblock %}
{% block content %}
<h1>Passkey einrichten</h1>
<section class="card">
  <p>Ersten Passkey für das Konto <strong>{{ account.get_username }}</strong> einrichten. Der Link gilt nur einmal.</p>
  <label for="passkey-name">Bezeichnung</label>
  <input id="passkey-name" maxlength="100" placeholder="z. B. YubiKey blau">
  <button type="button" class="primary" data-passkey="register" data-name-input="passkey-name"
          data-options-url="{% url 'accounts:enroll_options' token %}"
          data-submit-url="{% url 'accounts:enroll_finish' token %}">Passkey einrichten</button>
  <p class="status" id="passkey-status" role="status" aria-live="polite"></p>
</section>
{% endblock %}
