{% extends "counter/base.html" %}
{% block title %}Theke{% endblock %}
{% block theke %}
<h1 class="visually-hidden">Theke</h1>
<div class="tiles">
  <form method="post" action="{% url 'counter:checkout_new' %}">
    {% csrf_token %}
    <button type="submit" class="tile tile-out">Ausgabe<span>Teile ausleihen, Reservierung abholen</span></button>
  </form>
  <a class="tile tile-ret" href="{% url 'lending:overview' %}">Rückgabe<span>Offene Ausleihen</span></a>
  <a class="tile tile-dmg" href="{% url 'inventory:part_list' %}">Schaden melden<span>Teil wählen und sperren</span></a>
  <a class="tile tile-today" href="{% url 'lending:overview' %}">Heute<span>Abholungen und Rückgaben</span></a>
</div>
<ul class="theke-more">
  {% for label, name in more %}<li><a class="button" href="{% url name %}">{{ label }}</a></li>{% endfor %}
</ul>
{% endblock %}
