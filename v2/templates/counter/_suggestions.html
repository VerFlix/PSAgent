{% if items %}
  <ul class="suggestions">
    {% for item in items %}
      <li>
        <button type="button" data-ei-pick="{{ item.ei }}" class="suggestion{% if item.reasons %} problem{% endif %}"><strong>{{ item.ei }}</strong> {{ item.name }}{% if item.reasons %}<span>{{ item.reasons|join:", " }}</span>{% endif %}</button>
      </li>
    {% endfor %}
  </ul>
{% endif %}
