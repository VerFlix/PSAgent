# Nur für die lokale Entwicklung: PostgreSQL auf 127.0.0.1.
# Der Betrieb auf dem Pi (Caddy, gunicorn, WAL-G) folgt in Phase 4 und wird lokal eingerichtet.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: psagent
      POSTGRES_USER: psagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-psagent-dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psagent -d psagent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
